name: Publish community docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/community/**'
      - docs/zensical.toml
      - .github/workflows/community-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build site
        run: |
          python -m pip install zensical==0.1.3
          python -m zensical build --config-file docs/zensical.toml --clean

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

      - uses: actions/deploy-pages@v5
        id: deployment